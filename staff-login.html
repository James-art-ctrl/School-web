<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Login</title>

    <style>
      body {
        background: #e6e6e6;
        font-family: Arial, sans-serif;
      }

      .login-box {
        width: 400px;
        margin: 80px auto;
        background: #cfcfcf;
        border-radius: 10px;
        overflow: hidden;
      }

      .header {
        background: #3f4a8a;
        color: white;
        text-align: center;
        padding: 20px;
      }

      .header h2 {
        margin: 0;
      }

      .form {
        padding: 25px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #aaa;
        border-radius: 5px;
      }

      .password-wrap {
        position: relative;
      }

      .toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 14px;
        color: #555;
      }

      .btn {
        width: 100%;
        background: #0b8aa8;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn:hover {
        background: #066a82;
      }

      .note {
        text-align: center;
        margin-top: 10px;
        color: #555;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="header">
        <h2>Staff Login</h2>
        <p>Teacher / Staff Portal Access</p>
      </div>

      <div class="form">
        <div class="form-group">
          <label>Staff ID</label>
          <input type="text" id="staffId" placeholder="Enter Staff ID" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Enter Password" />
            <span class="toggle" onclick="togglePassword()">Show</span>
          </div>
        </div>

        <button class="btn" onclick="loginStaff()">Login</button>

        <div class="note">Demo Login: <b>T001 / admin123</b></div>
      </div>
    </div>

    <script>
      const staffAccounts = {
        T001: "admin123",
        T002: "teacher456",
      };

      function togglePassword() {
        const pass = document.getElementById("password");
        pass.type = pass.type === "password" ? "text" : "password";
      }

      function loginStaff() {
        const id = document.getElementById("staffId").value.trim();
        const password = document.getElementById("password").value;

        if (staffAccounts[id] && staffAccounts[id] === password) {
          alert("Login Successful");
          window.location.href = "Teacher.html";
        } else {
          alert("Invalid Staff ID or Password");
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Result</title>

    <style>
      body {
        background: #e6e6e6;
        font-family: Arial, sans-serif;
      }

      /* MAIN CONTAINER */
      .wrapper {
        width: 420px;
        margin: 70px auto;
        background: #cfcfcf;
        border-radius: 12px;
        padding-bottom: 20px;
      }

      /* HEADER */
      .header {
        background: #3f4a8a;
        color: white;
        text-align: center;
        padding: 15px;
        border-radius: 12px 12px 0 0;
      }

      .header h2 {
        margin: 0;
        font-size: 20px;
      }

      .header span {
        color: yellow;
        text-decoration: underline;
        font-size: 14px;
      }

      /* TERM BOX */
      .term-box {
        background: #3f4a8a;
        margin: 25px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        color: white;
      }

      .term-box h3 {
        margin-bottom: 5px;
      }

      .session {
        color: yellow;
        margin-bottom: 15px;
        font-weight: bold;
      }

      /* BUTTON */
      .btn {
        background: #0b8aa8;
        border: none;
        color: white;
        padding: 10px 25px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn:hover {
        background: #066a82;
      }

      /* BACK LINK */
      .back {
        margin-left: 20px;
        color: blue;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- HEADER -->
      <div class="header">
        <h2>CHECK RESULT</h2>
        <span>College</span>
      </div>

      <!-- FIRST TERM -->
      <div class="term-box">
        <h3>FIRST TERM</h3>
        <div class="session">2025/2026 Session</div>
        <a href="con2.html"><button class="btn">Check Result</button></a>
      </div>

      <!-- SECOND TERM -->
      <div class="term-box">
        <h3>SECOND TERM</h3>
        <div class="session">2025/2026 Session</div>
        <a href="con3.html"> <button class="btn">Check Result</button></a>
      </div>

      <!-- THIRD TERM -->
      <div class="term-box">
        <h3>THIRD TERM</h3>
        <div class="session">2024/2025 Session</div>
        <a href="confirm.html"><button class="btn">Check Result</button></a>
      </div>

      <!-- BACK -->
      <a href="index.html"><div class="back">&lt;&lt; Back</div></a>
    </div>
  </body>
</html>
